# Kustomization file for payment-api Kubernetes resources
# This file aggregates all resources and applies common labels/namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace to apply to all resources (overrides namespace in individual files)
namespace: payment-api

# Common labels to add to all resources
commonLabels:
  managed-by: kustomize
  environment: prod

# List of resource files to include
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# Common annotations to add to all resources (optional)
commonAnnotations:
  app.kubernetes.io/part-of: payment-api
